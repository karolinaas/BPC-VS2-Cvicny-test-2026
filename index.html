<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktivní test</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 90%;
            max-width: 600px;
            background-color: #1e1e1e;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            color: #9F1D35;
        }
        .question {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #333;
            border-radius: 5px;
            background-color: #2d2d2d;
        }
        .options {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
        }
        .options label {
            display: block;
            margin-bottom: 8px;
            padding: 8px;
            border-radius: 4px;
            transition: background-color 0.3s;
            width: 100%;
        }
        .options label:hover {
            background-color: #3e3e3e;
        }
        .option-image {
            width: 100%;
            height: auto;
            border-radius: 4px;
            cursor: pointer;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #800020;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 48%;
        }
        button:hover {
            background-color: #660019;
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        .correct {
            border: 2px solid #4caf50;
        }
        .incorrect {
            border: 2px solid #f44336;
        }
        .navigation {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .feedback {
            margin-top: 10px;
            font-weight: bold;
            text-align: center;
        }
        .stats {
            margin-top: 20px;
            font-weight: bold;
            text-align: center;
        }
        img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 10px auto;
        }
        audio {
            width: 100%;
            margin: 10px 0;
        }
        .submit-button {
            display: flex;
            justify-content: center;
        }
        .question-image {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 10px auto;
        }
        .text-answer-input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            background: #1e1e1e;
            color: #e0e0e0;
            border: 1px solid #555;
            border-radius: 4px;
            font-size: 1em;
            margin-top: 8px;
        }
        .text-answer-input:focus {
            outline: none;
            border-color: #800020;
        }
        .dropdown-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        .dropdown-row label {
            min-width: 100px;
            font-weight: bold;
            margin: 0;
            padding: 0;
            width: auto;
        }
        .dropdown-row select {
            flex: 1;
            background: #1e1e1e;
            color: #e0e0e0;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 1em;
        }
        .dropdown-row select:disabled {
            opacity: 0.8;
        }
        .dropdown-row .correct { border: 2px solid #4caf50; padding: 4px 8px; border-radius: 4px; }
        .dropdown-row .incorrect { border: 2px solid #f44336; padding: 4px 8px; border-radius: 4px; }
        .correct-answer-hint {
            margin-top: 8px;
            color: #aaa;
            font-size: 0.9em;
        }
        .partial {
            border: 2px solid #ff9800;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Interaktivní test</h1>
        <div id="quizForm"></div>
        <div id="stats" class="stats"></div>
    </div>

    <script src="questions.js"></script>

    <script>
        let currentQuestionIndex = 0;
        let score = 0;
        let shuffledQuestions = [];
        let userAnswers = [];
        let shuffledOptions = [];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function shuffleOptions(options) {
            const letters = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];
            const shuffledOpts = shuffleArray([...options]);
            return shuffledOpts.map((option, index) => ({
                letter: letters[index],
                value: option
            }));
        }

        function startQuiz() {
            shuffledQuestions = shuffleArray([...questions]);
            currentQuestionIndex = 0;
            score = 0;
            userAnswers = new Array(shuffledQuestions.length).fill(null);
            shuffledOptions = new Array(shuffledQuestions.length).fill(null);
            showQuestion(shuffledQuestions[currentQuestionIndex]);
            updateStats();
        }

        function getFeedback(question) {
            const ans = userAnswers[currentQuestionIndex];
            if (question.type === 'text') {
                const isCorrect = ans.toLowerCase().trim() === question.answer.toLowerCase().trim();
                return isCorrect
                    ? 'Správná odpověď'
                    : `Špatná odpověď. Správná odpověď: <strong>${question.answer}</strong>`;
            } else if (question.type === 'dropdown') {
                const allCorrect = question.dropdowns.every(dd => {
                    const a = ans.find(a => a.label === dd.label);
                    return a && a.value === dd.answer;
                });
                if (allCorrect) return 'Správná odpověď';
                const correctStr = question.dropdowns.map(dd => `${dd.label}: ${dd.answer}`).join(', ');
                return `Špatná odpověď. Správné odpovědi: <strong>${correctStr}</strong>`;
            } else if (question.type === 'multiselect') {
                const correct = question.correctAnswers;
                const correctCount = ans.filter(a => correct.includes(a)).length;
                const wrongCount = ans.filter(a => !correct.includes(a)).length;
                if (correctCount === correct.length && wrongCount === 0) return 'Správná odpověď';
                if (wrongCount === 0 && correctCount > 0)
                    return `Částečně správná odpověď (${correctCount} z ${correct.length} správně, nic špatného)`;
                return `Špatná odpověď. Správné odpovědi: <strong>${correct.join(', ')}</strong>`;
            } else {
                return ans === question.answer ? 'Správná odpověď' : 'Špatná odpověď';
            }
        }

        function showQuestion(question) {
            const quizForm = document.getElementById("quizForm");
            const answered = userAnswers[currentQuestionIndex] !== null;
            let optionsHTML = '';

            if (question.type === 'text') {
                if (answered) {
                    const isCorrect = userAnswers[currentQuestionIndex].toLowerCase().trim() === question.answer.toLowerCase().trim();
                    optionsHTML = `<div class="options"><div class="${isCorrect ? 'correct' : 'incorrect'}" style="padding:10px;border-radius:4px;width:100%;">
                        Vaše odpověď: <strong>${userAnswers[currentQuestionIndex]}</strong>
                    </div></div>`;
                } else {
                    optionsHTML = `<div class="options"><input type="text" id="textAnswer" class="text-answer-input" placeholder="Zadejte odpověď..."></div>`;
                }

            } else if (question.type === 'dropdown') {
                if (answered) {
                    optionsHTML = '<div class="options" style="flex-direction:column;">' +
                        question.dropdowns.map(dd => {
                            const userVal = (userAnswers[currentQuestionIndex].find(a => a.label === dd.label) || {}).value || '';
                            const isCorrect = userVal === dd.answer;
                            return `<div class="dropdown-row">
                                <label>${dd.label}:</label>
                                <span class="${isCorrect ? 'correct' : 'incorrect'}">${userVal}</span>
                                ${!isCorrect ? `<span class="correct-answer-hint">✓ ${dd.answer}</span>` : ''}
                            </div>`;
                        }).join('') + '</div>';
                } else {
                    optionsHTML = '<div class="options" style="flex-direction:column;">' +
                        question.dropdowns.map(dd => {
                            const shuffledDdOpts = shuffleArray([...dd.options]);
                            return `<div class="dropdown-row">
                                <label>${dd.label}:</label>
                                <select name="dd_${dd.label}">
                                    <option value="">-- vyberte --</option>
                                    ${shuffledDdOpts.map(o => `<option value="${o}">${o}</option>`).join('')}
                                </select>
                            </div>`;
                        }).join('') + '</div>';
                }

            } else if (question.type === 'multiselect') {
                if (!shuffledOptions[currentQuestionIndex]) {
                    shuffledOptions[currentQuestionIndex] = shuffleOptions([...question.options]);
                }
                optionsHTML = shuffledOptions[currentQuestionIndex].map(option => {
                    const isChecked = answered && userAnswers[currentQuestionIndex].includes(option.value);
                    const isCorrect = question.correctAnswers.includes(option.value);
                    let className = '';
                    if (answered) {
                        if (isCorrect) className = 'correct';
                        else if (isChecked) className = 'incorrect';
                    }
                    return `<label class="${className}"><input type="checkbox" name="answer" value="${option.value}" ${isChecked ? 'checked' : ''} ${answered ? 'disabled' : ''}> ${option.letter}. ${option.value}</label>`;
                }).join('');

            } else if (question.options) {
                if (!shuffledOptions[currentQuestionIndex]) {
                    shuffledOptions[currentQuestionIndex] = shuffleOptions([...question.options]);
                }
                optionsHTML = shuffledOptions[currentQuestionIndex].map(option => {
                    const isSelected = userAnswers[currentQuestionIndex] === option.value;
                    const isCorrect = option.value === question.answer;
                    const isIncorrect = answered && userAnswers[currentQuestionIndex] !== question.answer && userAnswers[currentQuestionIndex] === option.value;
                    let className = '';
                    if (answered) {
                        if (isCorrect) className = 'correct';
                        else if (isIncorrect) className = 'incorrect';
                    }
                    return `<label class="${className}"><input type="radio" name="answer" value="${option.value}" ${isSelected ? 'checked' : ''} ${answered ? 'disabled' : ''}> ${option.letter}. ${option.value}</label>`;
                }).join('');

            } else if (question.images) {
                const shuffledImages = shuffleArray([...question.images]);
                const letters = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];
                optionsHTML = shuffledImages.map((image, index) => {
                    const isSelected = userAnswers[currentQuestionIndex] === image;
                    const isCorrect = image === question.answer;
                    const isIncorrect = answered && userAnswers[currentQuestionIndex] !== question.answer && userAnswers[currentQuestionIndex] === image;
                    let className = '';
                    if (answered) {
                        if (isCorrect) className = 'correct';
                        else if (isIncorrect) className = 'incorrect';
                    }
                    return `<label class="${className}"><input type="radio" name="answer" value="${image}" ${isSelected ? 'checked' : ''} ${answered ? 'disabled' : ''}> ${letters[index]}. <img src="${image}" alt="Obrázek" class="option-image"></label>`;
                }).join('');
            }

            // Convert \n in question text to <br>
            const questionTextHTML = question.question.replace(/\n/g, '<br>');

            quizForm.innerHTML = `
                <div class="question">
                    <h3>${currentQuestionIndex + 1}. ${questionTextHTML}</h3>
                    ${question.questionImage ? `<img src="${question.questionImage}" alt="Obrázek v otázce" class="question-image">` : ''}
                    ${question.image ? `<img src="${question.image}" alt="Obrázek">` : ''}
                    ${question.audio ? `<audio controls><source src="${question.audio}" type="audio/mpeg">Váš prohlížeč nepodporuje audio element.</audio>` : ''}
                    ${question.type === 'multiselect' ? `<div class="options">${optionsHTML}</div>` : optionsHTML}
                    ${!answered ? `<div class="submit-button"><button type="button" onclick="submitAnswer()">Odeslat odpověď</button></div>` : ''}
                    ${answered ? `<div class="feedback">${getFeedback(question)}</div>` : ''}
                </div>
                <div class="navigation">
                    <button type="button" onclick="prevQuestion()" ${currentQuestionIndex === 0 ? 'disabled' : ''}>Předchozí otázka</button>
                    <button type="button" onclick="nextQuestion()" ${currentQuestionIndex === shuffledQuestions.length - 1 ? 'disabled' : ''}>Další otázka</button>
                </div>
            `;
        }

        function submitAnswer() {
            const q = shuffledQuestions[currentQuestionIndex];

            if (q.type === 'text') {
                const input = document.getElementById('textAnswer');
                if (!input || !input.value.trim()) { alert("Prosím, zadejte odpověď."); return; }
                userAnswers[currentQuestionIndex] = input.value.trim();
                if (userAnswers[currentQuestionIndex].toLowerCase().trim() === q.answer.toLowerCase().trim()) score++;

            } else if (q.type === 'dropdown') {
                const selects = document.querySelectorAll('select[name^="dd_"]');
                let allSelected = true;
                const answers = [];
                selects.forEach(sel => {
                    if (!sel.value) allSelected = false;
                    answers.push({ label: sel.name.replace('dd_', ''), value: sel.value });
                });
                if (!allSelected) { alert("Prosím, vyberte odpovědi ve všech polích."); return; }
                userAnswers[currentQuestionIndex] = answers;
                if (answers.every(a => {
                    const dd = q.dropdowns.find(d => d.label === a.label);
                    return dd && a.value === dd.answer;
                })) score++;

            } else if (q.type === 'multiselect') {
                const checked = [...document.querySelectorAll('input[name="answer"]:checked')].map(cb => cb.value);
                if (checked.length === 0) { alert("Prosím, vyberte alespoň jednu odpověď."); return; }
                userAnswers[currentQuestionIndex] = checked;
                const correct = q.correctAnswers;
                if (checked.length === correct.length && checked.every(c => correct.includes(c))) score++;

            } else {
                const selectedOption = document.querySelector('input[name="answer"]:checked');
                if (!selectedOption) { alert("Prosím, vyberte odpověď."); return; }
                userAnswers[currentQuestionIndex] = selectedOption.value;
                if (selectedOption.value === q.answer) score++;
            }

            showQuestion(q);
            updateStats();
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                showQuestion(shuffledQuestions[currentQuestionIndex]);
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < shuffledQuestions.length - 1) {
                currentQuestionIndex++;
                showQuestion(shuffledQuestions[currentQuestionIndex]);
            }
        }

        function updateStats() {
            const statsDiv = document.getElementById("stats");
            const totalQuestions = shuffledQuestions.length;
            statsDiv.innerHTML = `
                <p>Správné odpovědi: ${score} z ${totalQuestions}</p>
            `;
        }

        startQuiz();
    </script>
</body>
</html>
